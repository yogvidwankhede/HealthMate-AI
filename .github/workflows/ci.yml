name: ci
on: [push, pull_request]
jobs:
  metrics-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install numpy pytest
      - run: cd paper && python -m pytest -q test_metrics.py
