name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  metrics-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install numpy pytest
      - run: cd paper && python -m pytest -q test_metrics.py
